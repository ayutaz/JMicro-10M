<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JMicro-10M Chat</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<main>
  <header><div><p class="eyebrow">日本語 10Mモデル</p><h1>JMicro Chat</h1><p id="model">会話モデルを確認しています…</p></div><button id="reset" type="button">新しい会話</button></header>
  <section id="messages" aria-live="polite"><p id="empty">こんにちは。日常のことから話してみてください。</p></section>
  <form id="form"><label for="input">メッセージ</label><div class="compose"><textarea id="input" rows="2" maxlength="4000" placeholder="今日は何をしていた？" required></textarea><button id="send" type="submit">送信</button></div><p id="status" role="status">Enterで送信、Shift+Enterで改行</p></form>
  <footer>RealPersonaChatで3周学習した会話モデルです。短い返答や会話の流れを試せます。研究中のため、内容・文脈の取り違えが残ります。<a href="http://127.0.0.1:7860" target="_blank" rel="noopener">Baseの文章生成を開く</a></footer>
</main>
</body></html>
